name: Build and demo

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: gcc:15.2.0
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Show compiler
        run: g++ --version
      - name: Run demo
        run: make run -j2 CXX=g++
      - name: Run tests
        run: make test -j2 CXX=g++
